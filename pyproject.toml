[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsinduct-research"
version = "0.2.0"
description = "Axisymmetric torsional magnetic winding and braking in a spherical shell"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Daniil Lysenko"}]
keywords = ["magnetic winding", "magnetic braking", "magnetohydrodynamics", "Dedalus"]
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9", "h5py>=3.11", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
viz = ["pyvista>=0.49.2,<0.50", "vtk>=9.7.2,<9.8", "Pillow>=13"]
notebooks = ["nbformat>=5.10", "nbclient>=0.10", "jupyter-client>=8", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: numerical verification beyond routine checks", "dedalus: optional spectral PDE verification"]
